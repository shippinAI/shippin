name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    # Existing tests are not weakened to make a run pass; see scripts/ci/test-integrity.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: No test weakened without a stated reason
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          base="${PR_BASE:-$BEFORE}"
          # A queue branch is judged against everything not yet on main; a new branch has no before.
          if [[ "$REF" == refs/heads/queue/* ]] || [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=origin/main
          fi
          node scripts/ci/test-integrity.mjs "$base" "$GITHUB_SHA"
      - run: node --test scripts/ci/ci.test.mjs
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/shippin-agent
  governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: governance/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check-records
  console:
    runs-on: ubuntu-latest
    # Database tests share one disposable database and rebuild its schema, so packages run one at a
    # time. The URL is required: without it every database test skips, and this job — which the Gate
    # needs before main moves — would stay green. Postgres 17 matches the panel's own database.
    # Host auth is trust, same as a local test cluster: the audit tests log in as a second role
    # with an empty password (internal/db/audit_owner_db_test.go).
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: shippin_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: shippin_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U shippin_test -d shippin_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SHIPPIN_TEST_DATABASE_URL: postgres://shippin_test:disposable_ci_only@127.0.0.1:5432/shippin_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test, including the database tests
        run: node scripts/ci/database-tests.mjs
      - run: go vet ./...
      - run: go build -o /tmp/shippin-console ./cmd/console
      - run: go build -o /tmp/shippin-hostd ./cmd/shippin-hostd
      - run: go build -o /tmp/shippin-run ./cmd/shippin-run
  shippin-run-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/shippin-run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/shippin-run/package-lock.json
      - name: Install Chrome
        run: |
          set -euo pipefail
          sudo apt-get update
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get install -y -f
          google-chrome --version
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run budget
      - run: npm run lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch main so the boundary baseline can be compared with it
        working-directory: ${{ github.workspace }}
        run: git fetch origin main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npm run tokens
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash install/check-public-tree.sh
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/skills/lint.mjs
      - run: node --test scripts/skills/skills.test.mjs
  gitleaks:
    # Every commit in the history, not only the newest; findings checked by hand are in .gitleaksignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
  go-quality:
    # docs/release.md: golangci-lint on the lines a change touches, and known vulnerabilities in what the
    # binaries call. Both tools are pinned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint (new lines)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --new-from-merge-base=origin/main ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

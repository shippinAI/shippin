name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: governance/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check-records

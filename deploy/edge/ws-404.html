<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Workspace not found · Shippin.Cloud</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% -10%, #12324a 0%, #0a0d12 60%); color: #e6edf3; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(480px, calc(100% - 48px)); padding: 32px; border: 1px solid #1f2a36; border-radius: 14px; background: rgba(13, 18, 25, .85); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 28px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #38bdf8, #6366f1); }
  .code { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #38bdf8; letter-spacing: .08em; }
  h1 { margin: 6px 0 8px; font-size: 22px; }
  p { margin: 0 0 20px; color: #9fb0c0; }
  .host { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3; word-break: break-all; }
  a.btn { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: #0ea5e9; color: #04131d; font-weight: 600; text-decoration: none; }
  a.btn:hover { background: #38bdf8; }
  small { display: block; margin-top: 20px; color: #6b7c8c; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo"></span>Shippin.Cloud</div>
  <div class="code">404 · NOT FOUND</div>
  <h1>There's no workspace here</h1>
  <p>Nothing is published at this address. The workspace may have been deleted or renamed, the preview port may not be added yet, or the address has a typo.</p>
  <a class="btn" href="https://{$CONSOLE_HOST}/">Open the console</a>
  <small>Previews live at https://&lt;port&gt;--&lt;workspace&gt;.{$WS_BASE}</small>
</main>
</body>
</html>

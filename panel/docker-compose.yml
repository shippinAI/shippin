services:
  shippin-panel:
    build:
      context: ..
      dockerfile: panel/Dockerfile
      args:
        PANEL_BASE_PATH: /console/
    ports:
      - "${SHIPPIN_BIND_ADDRESS:-127.0.0.1}:${SHIPPIN_PANEL_PORT:-8088}:8080"
    restart: unless-stopped
    volumes:
      - ./public/config/runtime-config.json:/usr/share/nginx/html/config/runtime-config.json:ro

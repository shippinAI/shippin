services:
  clickhouse:
    image: ${SHIPPIN_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.36.3}
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${SHIPPIN_CLICKHOUSE_USER:-shippin}
      CLICKHOUSE_PASSWORD: ${SHIPPIN_CLICKHOUSE_PASSWORD:?Run python install/docker/configure.py first}
      CLICKHOUSE_DB: ${SHIPPIN_CLICKHOUSE_DB:-shippin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8123/ping | grep -qx Ok.']
      interval: 5s
      timeout: 3s
      retries: 30

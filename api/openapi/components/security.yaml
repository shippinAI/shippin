nomen:
  type: openIdConnect
  description: |
    Nomen OIDC. Send `Authorization: Bearer <access token>`.
    The audience separates `console` from `operator`. Fine-grained checks run live in OpenFGA
    on every request; token claims are coarse only. The discovery URL below is an
    example and must be configured for the installation's identity provider.
  openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration

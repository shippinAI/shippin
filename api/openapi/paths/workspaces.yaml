workspaces:
  parameters: [ { $ref: ../components/parameters.yaml#/TenantId } ]
  get:
    tags: [workspaces]
    operationId: listWorkspaces
    summary: List workspaces
    parameters:
      - $ref: ../components/parameters.yaml#/FolderFilter
      - { name: state, in: query, schema: { type: string } }
      - $ref: ../components/parameters.yaml#/PageSize
      - $ref: ../components/parameters.yaml#/PageToken
    responses:
      "200":
        description: Page of workspaces.
        content: { application/json: { schema: { $ref: ../schemas/workspaces.yaml#/WorkspaceList } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  post:
    tags: [workspaces]
    operationId: createWorkspace
    summary: Create a workspace (Incus instance + home volume) in the tenant project
    parameters: [ { $ref: ../components/parameters.yaml#/IdempotencyKey } ]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: ../schemas/workspaces.yaml#/WorkspaceCreate } } }
    responses:
      "202": { $ref: ../components/responses.yaml#/Accepted }
      "409": { $ref: ../components/responses.yaml#/Problem409 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
workspace:
  parameters:
    - $ref: ../components/parameters.yaml#/TenantId
    - $ref: ../components/parameters.yaml#/WorkspaceId
  get:
    tags: [workspaces]
    operationId: getWorkspace
    summary: Get a workspace
    responses:
      "200":
        description: The workspace.
        headers: { ETag: { schema: { type: string } } }
        content: { application/json: { schema: { $ref: ../schemas/workspaces.yaml#/Workspace } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  patch:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [workspaces]
    operationId: updateWorkspace
    summary: Rename, move folder, resize or relabel
    parameters: [ { $ref: ../components/parameters.yaml#/IfMatch } ]
    requestBody:
      required: true
      content: { application/merge-patch+json: { schema: { $ref: ../schemas/workspaces.yaml#/WorkspaceUpdate } } }
    responses:
      "200":
        description: Updated (resize may also start a job).
        content: { application/json: { schema: { $ref: ../schemas/workspaces.yaml#/Workspace } } }
      "412": { $ref: ../components/responses.yaml#/Problem412 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  delete:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [workspaces]
    operationId: deleteWorkspace
    summary: Delete a workspace and its home volume
    parameters: [ { $ref: ../components/parameters.yaml#/IdempotencyKey } ]
    responses:
      "202": { $ref: ../components/responses.yaml#/Accepted }
      "409": { $ref: ../components/responses.yaml#/Problem409 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }

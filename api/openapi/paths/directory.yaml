setup:
  post:
    tags: [identity]
    operationId: claimInstallation
    summary: Create the installation's first owner, with no setup code; refused once an owner exists
    description: >-
      While the installation has no owner, the first claim creates the owner account, the installation's
      organization and, when given, its brand, and signs the caller in (REL-03). An installation can also name
      its owner up front with SHIPPIN_OWNER_EMAIL and nobody calls this.
    x-implementation-status: registered
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, email, password]
            properties:
              name: {type: string, minLength: 1, maxLength: 120}
              email: {type: string, format: email}
              username: {type: string, minLength: 3, maxLength: 32, description: "Made from the email address when absent."}
              password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
              organization: {type: string, minLength: 2, maxLength: 120, description: "Operations when absent."}
              brand:
                type: object
                description: The installation's branding; when absent the panel keeps its default.
                required: [name]
                properties:
                  name: {type: string, maxLength: 80}
                  short: {type: string, maxLength: 24}
                  tagline: {type: string, maxLength: 160}
                  logo_url: {type: string, format: uri}
                  color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
                  privacy_url: {type: string, format: uri}
                  terms_url: {type: string, format: uri}
    responses:
      "200": {description: "The owner's id and username, a session, and the owner's recovery codes, shown once."}
      "400": {$ref: ../components/responses.yaml#/Problem400}
      "409": {description: The installation already has an owner, or the email address or username is in use.}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
passwordLogin:
  post:
    tags: [identity]
    operationId: signInWithPassword
    summary: Start a local session with username or email and password
    x-implementation-status: registered
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [identifier, password]
            properties:
              identifier: {type: string}
              password: {type: string, writeOnly: true}
    responses:
      "200": {description: Local session started.}
      "401": {$ref: ../components/responses.yaml#/Problem401}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
passwordChange:
  put:
    tags: [identity]
    operationId: changeLocalPassword
    summary: Set a first local password or change an existing password for the signed-in user
    security: [{consoleSession: []}]
    x-implementation-status: registered
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              current_password: {type: string, writeOnly: true}
              password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    responses:
      "200": {description: Password updated.}
      "401": {$ref: ../components/responses.yaml#/Problem401}
      "429": {$ref: ../components/responses.yaml#/Problem429}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
magic:
  post:
    tags: [identity]
    operationId: requestMagicLink
    summary: Email a one-time sign-in link
    x-implementation-status: registered
    responses:
      "200": {description: The link was queued.}
      "400": {$ref: ../components/responses.yaml#/Problem400}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
waitlist:
  post:
    tags: [identity]
    operationId: joinWaitlist
    summary: Request early access. Confirmation is a second email.
    x-implementation-status: registered
    responses:
      "200": {description: The address is pending confirmation.}
      "429": {$ref: ../components/responses.yaml#/Problem429}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
waitlistCsv:
  get:
    tags: [identity]
    operationId: exportWaitlist
    summary: Export the waitlist as CSV
    security: [{apiKey: []}, {consoleSession: []}]
    x-implementation-status: registered
    responses:
      "200": {description: CSV body.}
      "401": {$ref: ../components/responses.yaml#/Problem401}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
adminConfig:
  get:
    tags: [identity]
    operationId: getDirectoryConfig
    summary: Read the directory policy and branding overlay, with a version
    security: [{apiKey: []}, {consoleSession: []}]
    x-implementation-status: registered
    responses:
      "200": {description: Versioned directory configuration.}
      "401": {$ref: ../components/responses.yaml#/Problem401}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}

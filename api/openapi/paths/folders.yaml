folders:
  parameters: [ { $ref: ../components/parameters.yaml#/TenantId } ]
  get:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [folders]
    operationId: listFolders
    summary: List folders (optionally a subtree)
    parameters:
      - $ref: ../components/parameters.yaml#/FolderFilter
      - $ref: ../components/parameters.yaml#/PageSize
      - $ref: ../components/parameters.yaml#/PageToken
    responses:
      "200":
        description: Page of folders.
        content: { application/json: { schema: { $ref: ../schemas/folders.yaml#/FolderList } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  post:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [folders]
    operationId: createFolder
    summary: Create a folder
    parameters: [ { $ref: ../components/parameters.yaml#/IdempotencyKey } ]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: ../schemas/folders.yaml#/FolderCreate } } }
    responses:
      "201":
        description: Created.
        content: { application/json: { schema: { $ref: ../schemas/folders.yaml#/Folder } } }
      "409": { $ref: ../components/responses.yaml#/Problem409 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
folder:
  parameters:
    - $ref: ../components/parameters.yaml#/TenantId
    - $ref: ../components/parameters.yaml#/FolderId
  get:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [folders]
    operationId: getFolder
    summary: Get a folder
    responses:
      "200":
        description: The folder.
        content: { application/json: { schema: { $ref: ../schemas/folders.yaml#/Folder } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  patch:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [folders]
    operationId: updateFolder
    summary: Rename or relabel (DB only)
    parameters: [ { $ref: ../components/parameters.yaml#/IfMatch } ]
    requestBody:
      required: true
      content: { application/merge-patch+json: { schema: { $ref: ../schemas/folders.yaml#/FolderUpdate } } }
    responses:
      "200":
        description: Updated.
        content: { application/json: { schema: { $ref: ../schemas/folders.yaml#/Folder } } }
      "412": { $ref: ../components/responses.yaml#/Problem412 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  delete:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [folders]
    operationId: deleteFolder
    summary: Delete an empty folder
    responses:
      "204": { $ref: ../components/responses.yaml#/NoContent }
      "409": { $ref: ../components/responses.yaml#/Problem409 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }

githubRepos:
  parameters:
  - name: tenantId
    in: path
    required: true
    schema: *id001
  get:
    tags: [github-runtime]
    operationId: githubReposGet
    summary: List repositories of tenant installations
    description: Lists repositories accessible through tenant-bound installations; individual installation failures
      appear in the response.
    x-source: shippin-console/internal/api/github_repos.go:githubRepos
    x-implementation-status: registered
    security:
    - consoleSession: []
    - zitadel: []
    responses:
      '200':
        description: Lists repositories accessible through tenant-bound installations; individual installation failures
          appear in the response.
        content:
          application/json:
            schema:
              type: object
              properties:
                installations:
                  type: array
                  items: &id003 {type: object, additionalProperties: true}
                can_install: {type: boolean}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
githubImport:
  parameters:
  - name: tenantId
    in: path
    required: true
    schema: *id001
  post:
    tags: [github-runtime]
    operationId: githubImportPost
    summary: Import a repository into own devspace
    description: Member manager only; verifies installation ownership and repository visibility. Requires the caller
      running devspace. Creates an owned project after cloning.
    x-source: shippin-console/internal/api/github_import.go:githubImport
    x-implementation-status: registered
    security:
    - consoleSession: []
    - zitadel: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [installation_id, repo_id]
            properties:
              installation_id: *id002
              repo_id: *id002
              branch: *id001
    responses:
      '201':
        description: Member manager only; verifies installation ownership and repository visibility. Requires the
          caller running devspace. Creates an owned project after cloning.
        content:
          application/json:
            schema: *id003
      default: {$ref: ../components/responses.yaml#/ProblemDefault}
githubWebhook:
  post:
    tags: [github-runtime]
    operationId: githubWebhookPost
    summary: Receive signed GitHub installation events
    description: Verifies HMAC signature and delivery ID; duplicate delivery IDs are acknowledged without reapplying.
      Disabled integration returns 404. Errors here use text/plain, not the normal Problem envelope.
    x-source: shippin-console/internal/api/github_hooks.go:githubWebhook
    x-implementation-status: registered
    security:
    - githubSignature: []
    requestBody:
      required: true
      content:
        application/json:
          schema: *id003
    responses:
      '204': {description: 'Verifies HMAC signature and delivery ID; duplicate delivery IDs are acknowledged without
          reapplying. Disabled integration returns 404. Errors here use text/plain, not the normal Problem envelope.'}
      default:
        description: Webhook validation or availability failure.
        content:
          text/plain:
            schema: *id001
    parameters:
    - name: X-GitHub-Delivery
      in: header
      required: true
      schema: *id001
    - name: X-GitHub-Event
      in: header
      required: true
      schema: *id001

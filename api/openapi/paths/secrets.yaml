secrets:
  parameters:
    - $ref: ../components/parameters.yaml#/TenantId
    - $ref: ../components/parameters.yaml#/Env
  get:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [secrets]
    operationId: listSecrets
    summary: List secret metadata in an environment (Vaultix proxy; values never listed)
    parameters:
      - { name: path, in: query, schema: { type: string } }
      - $ref: ../components/parameters.yaml#/PageSize
      - $ref: ../components/parameters.yaml#/PageToken
    responses:
      "200":
        description: Page of secret metadata.
        content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/SecretList } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  post:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [secrets]
    operationId: createSecret
    summary: Create a secret
    parameters: [ { $ref: ../components/parameters.yaml#/IdempotencyKey } ]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/SecretWrite } } }
    responses:
      "201":
        description: Created (metadata only).
        content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/Secret } } }
      "409": { $ref: ../components/responses.yaml#/Problem409 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
secret:
  parameters:
    - $ref: ../components/parameters.yaml#/TenantId
    - $ref: ../components/parameters.yaml#/Env
    - { name: secretId, in: path, required: true, schema: { $ref: ../schemas/common.yaml#/Uuid } }
  get:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [secrets]
    operationId: getSecret
    summary: Get a secret; the value only with reveal=true (audited)
    parameters:
      - { name: reveal, in: query, schema: { type: boolean, default: false } }
    responses:
      "200":
        description: The secret.
        content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/Secret } } }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  put:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [secrets]
    operationId: updateSecret
    summary: Set a new value (new version)
    parameters: [ { $ref: ../components/parameters.yaml#/IfMatch } ]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/SecretWrite } } }
    responses:
      "200":
        description: Updated (metadata only).
        content: { application/json: { schema: { $ref: ../schemas/vaultix.yaml#/Secret } } }
      "412": { $ref: ../components/responses.yaml#/Problem412 }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }
  delete:
    x-implementation-status: planned
    x-implementation-note: Retained design intent; this method is not registered in console baseline 2f5c422.
    tags: [secrets]
    operationId: deleteSecret
    summary: Delete a secret
    responses:
      "204": { $ref: ../components/responses.yaml#/NoContent }
      "400": { $ref: ../components/responses.yaml#/Problem400 }
      "401": { $ref: ../components/responses.yaml#/Problem401 }
      "403": { $ref: ../components/responses.yaml#/Problem403 }
      "404": { $ref: ../components/responses.yaml#/Problem404 }
      "429": { $ref: ../components/responses.yaml#/Problem429 }
      default: { $ref: ../components/responses.yaml#/ProblemDefault }

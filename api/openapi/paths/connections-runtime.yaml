connections:
  parameters:
  - name: tenantId
    in: path
    required: true
    schema: &id001 {type: string}
  - name: workspaceId
    in: path
    required: true
    schema: *id001
  get:
    tags: [connections-runtime]
    operationId: connectionsGet
    summary: Read workspace provider connections
    description: Feature-gated. Only a tenant member who created the workspace or manages the tenant may use this
      route; staff grants alone do not qualify. Returns status and Vaultix presence metadata, not stored token values.
    x-source: shippin-console/internal/api/connect_handlers.go:listConnections
    x-implementation-status: registered
    security:
    - consoleSession: []
    - zitadel: []
    responses:
      '200':
        description: Feature-gated. Only a tenant member who created the workspace or manages the tenant may use
          this route; staff grants alone do not qualify. Returns status and Vaultix presence metadata, not stored
          token values.
        content:
          application/json:
            schema:
              type: object
              properties:
                checked_at: *id001
                running: {type: boolean}
                ide_terminal_url: *id001
                connections:
                  type: array
                  items: &id002 {type: object, additionalProperties: true}
      default: {$ref: ../components/responses.yaml#/ProblemDefault}

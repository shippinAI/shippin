connectToken:
  parameters:
  - name: tenantId
    in: path
    required: true
    schema: *id001
  - name: workspaceId
    in: path
    required: true
    schema: *id001
  - name: provider
    in: path
    required: true
    schema: *id001
  put:
    tags: [connections-runtime]
    operationId: connectTokenPut
    summary: Store a workspace provider token
    description: Feature-gated. Only a tenant member who created the workspace or manages the tenant may use this
      route; staff grants alone do not qualify. Stores in Vaultix and delivers to a running workspace. A 409 can
      mean saved in Vaultix but delivery failed; no token is echoed.
    x-source: shippin-console/internal/api/connect_tokens.go:putConnectToken
    x-implementation-status: registered
    security:
    - consoleSession: []
    - zitadel: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: {type: string, writeOnly: true}
              expires_at:
                type: [string, 'null']
                format: date-time
    responses:
      '200':
        description: Feature-gated. Only a tenant member who created the workspace or manages the tenant may use
          this route; staff grants alone do not qualify. Stores in Vaultix and delivers to a running workspace.
          A 409 can mean saved in Vaultix but delivery failed; no token is echoed.
        content:
          application/json:
            schema:
              type: object
              properties:
                status: *id001
      default: {$ref: ../components/responses.yaml#/ProblemDefault}

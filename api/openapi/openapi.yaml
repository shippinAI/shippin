openapi: 3.1.0
info:
  title: Shippin.Cloud control-plane API
  version: 0.1.0
  summary: One API for the console, CLI and automation.
  description: |
    Draft v0.1 (2026-10-15). The Go control plane wraps Incus, Zitadel (Nomen),
    Infisical (Vaultix), OVN and Caddy. Clients never call those systems directly.
    Implementation status is operation-specific: planned methods are retained design intent;
    registered methods exist in source but are not proof of deployment or provider readiness;
    blocked methods accept requests but cannot complete the documented downstream workflow.
    Runtime additions document requests and response envelopes; nested provider/store records
    remain extensible and carry source references. The conventions below describe design intent,
    not a claim that every registered endpoint implements pagination, ETags or durable jobs.
    Conventions:
    - Every resource id is a UUID. Names are labels only.
    - Auth: Zitadel OIDC access token as a bearer (JWT). Nomen later, same contract.
    - Errors: RFC 9457 `application/problem+json` with a `message` for toasts.
    - Lists: cursor pagination (`page_size`, `page_token` → `next_page_token`).
    - Mutations: an `Idempotency-Key` header (UUID). A replay returns the first result.
    - Long-running work returns `202` + a Job. Poll `/jobs/{jobId}` or watch the events stream.
    - Updates: `ETag` / `If-Match` for optimistic concurrency.
  contact:
    name: Shippin.Cloud
servers:
  - url: /v1
    description: Relative to the configured API origin for this installation.
security:
  - zitadel: []
tags:
  - name: tenants
    description: Tenant (= Zitadel org) lifecycle. Operator and signup.
  - name: folders
    description: Nested folders inside a tenant.
  - name: workspaces
    description: Dev workspaces (Incus instances).
  - name: jobs
    description: Long-running operations.
  - name: members
    description: Members and roles (Zitadel users + OpenFGA tuples).
  - name: settings
    description: Platform and tenant settings (domains, brands, plans).
  - name: secrets
    description: Vaultix (Infisical) proxied, scoped per tenant.
  - name: identity
    description: Nomen (Zitadel) proxied, customer apps and agent service users.
  - name: rrflow
    description: AI governance policies.
  - name: audit
    description: Append-only audit trail.
  - name: me
    description: The calling identity.
  - name: platform
    description: Operator views of the platform itself (health, instances).
  - name: compute-nodes
    description: Planned operator management of enrolled compute hosts.

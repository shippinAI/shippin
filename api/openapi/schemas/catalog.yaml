CatalogService:
  type: object
  additionalProperties: false
  required: [id, label, config_schema, default_config, deployment_source, runtime_contract, required, active]
  properties:
    id: { type: string, pattern: '^[a-z][a-z0-9_-]{1,39}$' }
    label: { type: string, minLength: 1 }
    description: { type: string }
    kind: { type: string }
    docs_url: { type: string, format: uri-reference }
    config_schema:
      type: object
      description: >-
        A JSON Schema 2020-12 object schema. Deployable definitions require
        additionalProperties=false for every object and use format
        shippin-secret-ref for Vaultix or SOPS references. Remote $ref and
        dynamic property names are rejected by the control plane.
    default_config: { type: object, additionalProperties: true }
    deployment_source:
      oneOf:
        - { type: 'null' }
        - $ref: '#/DeploymentSource'
    runtime_contract:
      oneOf:
        - { type: 'null' }
        - $ref: '#/RuntimeContract'
    required: { type: boolean }
    active: { type: boolean }
    updated_at: { type: string, format: date-time }
CatalogServiceInput:
  type: object
  additionalProperties: false
  required: [id, label]
  properties:
    id: { type: string, pattern: '^[a-z][a-z0-9_-]{1,39}$' }
    label: { type: string, minLength: 1 }
    description: { type: string }
    kind: { type: string }
    docs_url: { type: string, format: uri-reference }
    config_schema:
      type: object
      description: >-
        A JSON Schema 2020-12 object schema. Deployable definitions require
        additionalProperties=false for every object and use format
        shippin-secret-ref for Vaultix or SOPS references. Remote $ref and
        dynamic property names are rejected by the control plane.
    default_config: { type: object, additionalProperties: true }
    deployment_source:
      oneOf:
        - { type: 'null' }
        - $ref: '#/DeploymentSource'
    runtime_contract:
      oneOf:
        - { type: 'null' }
        - $ref: '#/RuntimeContract'
    required: { type: boolean }
    active: { type: boolean }
CatalogServiceUpdate:
  type: object
  additionalProperties: false
  required: [label]
  properties:
    label: { type: string, minLength: 1 }
    description: { type: string }
    kind: { type: string }
    docs_url: { type: string, format: uri-reference }
    config_schema:
      type: object
      description: >-
        A JSON Schema 2020-12 object schema. Deployable definitions require
        additionalProperties=false for every object and use format
        shippin-secret-ref for Vaultix or SOPS references. Remote $ref and
        dynamic property names are rejected by the control plane.
    default_config: { type: object, additionalProperties: true }
    deployment_source:
      oneOf:
        - { type: 'null' }
        - $ref: '#/DeploymentSource'
    runtime_contract:
      oneOf:
        - { type: 'null' }
        - $ref: '#/RuntimeContract'
    required: { type: boolean }
    active: { type: boolean }
DeploymentSource:
  type: object
  additionalProperties: false
  required: [kind, reference]
  properties:
    kind: { type: string, enum: [github, git, oci] }
    reference: { type: string, minLength: 1, maxLength: 2048 }
    commit: { type: string, pattern: '^(?:[a-f0-9]{40}|[a-f0-9]{64})$' }
    context_path: { type: string, maxLength: 512 }
    credential_ref:
      type: string
      maxLength: 1024
      pattern: '^(vaultix|sops)://'
RuntimeContract:
  oneOf:
    - $ref: '#/RuntimeContractV1'
    - $ref: '#/RuntimeContractV2'
RuntimeContractV1:
  type: object
  additionalProperties: false
  required: [version, kind, providers]
  properties:
    version: { type: integer, const: 1 }
    kind: { type: string, const: incus_oci_container }
    providers:
      type: array
      minItems: 1
      maxItems: 1
      prefixItems: [{ type: string, const: incus }]
RuntimeContractV2:
  type: object
  additionalProperties: false
  required: [version, kind, providers, resources, storage, network, health]
  properties:
    version: { type: integer, const: 2 }
    kind: { type: string, const: incus_oci_container }
    providers:
      type: array
      minItems: 1
      maxItems: 1
      prefixItems: [{ type: string, const: incus }]
    resources:
      type: object
      additionalProperties: false
      required: [cpu_cores, memory_mib]
      properties:
        cpu_cores: { type: integer, minimum: 1, maximum: 64 }
        memory_mib: { type: integer, minimum: 128, maximum: 1048576 }
    storage:
      type: object
      additionalProperties: false
      required: [size_gib, mount_path]
      properties:
        size_gib: { type: integer, minimum: 1, maximum: 65536 }
        mount_path: { type: string, minLength: 2, maxLength: 512, description: Normalized absolute path without traversal segments or control characters; validated by the catalog API. }
    network:
      type: object
      additionalProperties: false
      required: [exposure, ports]
      properties:
        exposure: { type: string, enum: [private, edge] }
        ports:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [name, protocol, container_port]
            properties:
              name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
              protocol: { type: string, enum: [tcp, udp] }
              container_port: { type: integer, minimum: 1, maximum: 65535 }
    health:
      type: object
      additionalProperties: false
      required: [kind, port, interval_seconds, timeout_seconds, failure_threshold]
      properties:
        kind: { type: string, enum: [tcp, http] }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: string, minLength: 2, maxLength: 2048, description: Normalized absolute HTTP path without query, fragment, traversal segments or control characters; validated by the catalog API. }
        interval_seconds: { type: integer, minimum: 5, maximum: 300 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        failure_threshold: { type: integer, minimum: 1, maximum: 10 }
      allOf:
        - if: { properties: { kind: { const: http } }, required: [kind] }
          then: { required: [path] }
        - if: { properties: { kind: { const: tcp } }, required: [kind] }
          then: { not: { required: [path] } }
